name: Release Windows Native

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
  build-win:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout orchidea-protocol
        if: vars.ORCHIDEA_PROTOCOL_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ORCHIDEA_PROTOCOL_REPO }}
          path: orchidea-protocol

      - name: Link orchidea-protocol sibling path
        if: vars.ORCHIDEA_PROTOCOL_REPO != ''
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $parent = Split-Path $workspace -Parent
          $source = Join-Path $workspace "orchidea-protocol"
          $target = Join-Path $parent "orchidea-protocol"
          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }
          New-Item -ItemType Junction -Path $target -Target $source | Out-Null

      - name: Create orchidea-protocol stub (no repo variable set)
        if: vars.ORCHIDEA_PROTOCOL_REPO == ''
        shell: pwsh
        run: |
          $target = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "orchidea-protocol"
          New-Item -ItemType Directory -Path (Join-Path $target "dist") -Force | Out-Null
          Set-Content -Path (Join-Path $target "package.json") -Value '{"name":"@orchidea/protocol","version":"1.0.0","type":"module","main":"./dist/index.js"}'
          Set-Content -Path (Join-Path $target "dist/index.js") -Value 'export {};'
          Write-Host "Created minimal orchidea-protocol stub at $target"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install

      - name: Build Windows installer natively
        run: bun run build:win
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchidea-desktop-win-x64
          path: |
            packages/desktop/release/orchidea-desktop-x64.exe
            packages/desktop/release/orchidea-desktop-x64.zip
            packages/desktop/release/latest*.yml
            packages/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
